name: Build RemotePortable Windows x64

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build portable EXE with bundled FFmpeg
        shell: pwsh
        run: ./build.ps1

      - name: Verify output
        shell: pwsh
        run: |
          if (!(Test-Path 'publish/RemotePortable.exe')) {
            throw 'RemotePortable.exe nao foi gerado'
          }
          Get-Item 'publish/RemotePortable.exe' | Select-Object Name,Length

      - name: Package Windows application
        shell: pwsh
        run: |
          if (!(Test-Path 'publish/RemotePortable.Tunnel.exe')) { throw 'Tunnel ausente' }
          Compress-Archive -Path 'publish/RemotePortable.exe','publish/RemotePortable.Tunnel.exe' -DestinationPath 'RemotePortable-Windows-x64.zip' -Force

      - name: Upload Windows download
        uses: actions/upload-artifact@v4
        with:
          name: RemotePortable-Windows-x64
          path: RemotePortable-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
