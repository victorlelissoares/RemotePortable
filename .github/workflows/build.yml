name: Build RemotePortable Windows x64

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build portable EXE with bundled FFmpeg
        shell: pwsh
        run: ./build.ps1

      - name: Verify output
        shell: pwsh
        run: |
          if (!(Test-Path 'publish/RemotePortable.exe')) {
            throw 'RemotePortable.exe nao foi gerado'
          }
          Get-Item 'publish/RemotePortable.exe' | Select-Object Name,Length

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: RemotePortable-win-x64
          path: |
            publish/RemotePortable.exe
            publish/RemotePortable.Tunnel.exe
          if-no-files-found: error
          retention-days: 30

      - name: Package Windows application
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: pwsh
        run: |
          if (!(Test-Path 'publish/RemotePortable.Tunnel.exe')) { throw 'Tunnel ausente' }
          Compress-Archive -Path 'publish/RemotePortable.exe','publish/RemotePortable.Tunnel.exe' -DestinationPath 'RemotePortable-Windows-x64.zip' -Force

      - name: Setup ORAS
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: oras-project/setup-oras@v1

      - name: Publish Windows package to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $env:GH_TOKEN | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          if ($LASTEXITCODE -ne 0) { throw 'GHCR login failed' }
          $package = "ghcr.io/${{ github.repository_owner }}/remoteportable-windows".ToLowerInvariant()
          oras push "$($package):sha-${{ github.sha }}" "RemotePortable-Windows-x64.zip:application/zip" --artifact-type "application/vnd.remoteportable.desktop.v1"
          if ($LASTEXITCODE -ne 0) { throw 'GHCR publish failed' }
          oras tag "$($package):sha-${{ github.sha }}" latest
          if ($LASTEXITCODE -ne 0) { throw 'GHCR latest tag failed' }
